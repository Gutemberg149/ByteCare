spring:
  application:
    name: bytecare

  # ========== DATA SOURCE (ORACLE) ==========
  datasource:
    url: jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL
    driver-class-name: oracle.jdbc.OracleDriver
    username: rm562267
    password: fiap26
    hikari:
      pool-name: bytecareOracleHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      validation-timeout: 5000
      leak-detection-threshold: 60000
      auto-commit: false

  # ========== JPA / HIBERNATE ==========
  jpa:
    open-in-view: false
    show-sql: true
    generate-ddl: true
    hibernate:
      ddl-auto: update # Mude para 'create' apenas para forçar a recriação do banco
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        order_inserts: true
        order_updates: true
        jdbc:
          batch_size: 30
          fetch_size: 100

  # ========== WEB / MVC ==========
  mvc:
    format:
      date: yyyy-MM-dd
      date-time: yyyy-MM-dd HH:mm:ss
  web:
    error:
      include-binding-errors: always
      include-message: always
      include-stacktrace: never

# ========== SPRINGDOC OPENAPI ==========
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    doc-expansion: none
    try-it-out-enabled: true
  info:
    title: ByteCare API
    description: API para gerenciamento de cuidados com animais de estimação.
    version: 1.0.0

# ========== SERVER ==========
server:
  port: 8080
  compression:
    enabled: true
  error:
    include-message: always
    include-stacktrace: never

# ========== LOGGING ==========
logging:
  level:
    root: INFO
    br.com.fiap.javaadv.blog.backend: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.web: DEBUG
    com.zaxxer.hikari: INFO

# ========== MANAGEMENT ==========
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always