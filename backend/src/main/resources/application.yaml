spring:
  application:
    name: bytecare

  datasource:
    url: jdbc:h2:mem:bytecaredb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 900000
      pool-name: bytecareHikariConnectionPool

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        trace: false
        web-allow-others: false

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    database-platform: org.hibernate.dialect.H2Dialect

  main:
    banner-mode: console

  mvc:
    servlet:
      load-on-startup: 1
    format:
      date: yyyy-MM-dd
      date-time: yyyy-MM-dd HH:mm:ss

  web:
    error:
      include-binding-errors: always
      include-stacktrace: never
      include-message: always
      include-exception: false

# Configurações do SpringDoc OpenAPI (Swagger)
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    filter: true
    enabled: true
    try-it-out-enabled: true
    doc-expansion: none

  # Informações da API para o Swagger
  info:
    title: ByteCare API
    description: |
      API para gerenciamento de cuidados com animais de estimação.
      
      ## Funcionalidades
      - Cadastro e gerenciamento de animais
      - Registro de ações preventivas (vacinas, vermífugos)
      - Registro de atividades de bem-estar
      - Registro de tratamentos terapêuticos
      - Consulta de histórico de cuidados
      
      ## Tecnologias
      - Spring Boot 3.4.5
      - Spring Data JPA
      - H2 Database
      - Lombok
      - OpenAPI 3.0
    version: 1.0.0
    contact:
      name: ByteCare Team
      email: contato@bytecare.com
    license:
      name: MIT License
      url: https://opensource.org/licenses/MIT

# Logging
logging:
  level:
    root: INFO
    br.com.fiap.javaadv.blog.backend: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.web: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"
  file:
    name: logs/bytecare.log
    path: logs
    max-size: 10MB
    max-history: 30

# Server
server:
  port: 8080
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024
  error:
    include-stacktrace: never
    include-message: always

# Management (Actuator - opcional)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always